
name: Deploy to Natro

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: natro-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Deploy website via FTPS
        env:
          FTP_HOST: ${{ secrets.NATRO_FTP_HOST }}
          FTP_USER: ${{ secrets.NATRO_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NATRO_FTP_PASSWORD }}
        run: |
          set -e

          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true

          set net:max-retries 3
          set net:timeout 60
          set net:reconnect-interval-base 5
          set net:reconnect-interval-max 20
          set cmd:fail-exit true

          debug 3

          mirror --reverse \
            --verbose \
            --no-perms \
            --exclude-glob .git/ \
            --exclude-glob .github/ \
            --exclude-glob .DS_Store \
            --exclude-glob README.md \
            ./ /httpdocs/

          bye
          EOF
