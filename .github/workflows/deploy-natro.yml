
name: Test Natro FTPS Connection

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-connection:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install lftp
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Test secure FTPS connection
        env:
          FTP_HOST: ${{ secrets.NATRO_FTP_HOST }}
          FTP_USER: ${{ secrets.NATRO_FTP_USER }}
          FTP_PASSWORD: ${{ secrets.NATRO_FTP_PASSWORD }}
        run: |
          lftp -u "$FTP_USER","$FTP_PASSWORD" "ftp://$FTP_HOST:21" <<'EOF'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 1
          set net:timeout 15
          set cmd:fail-exit true
          pwd
          cd httpdocs
          ls
          bye
          EOF
